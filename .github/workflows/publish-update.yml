name: Publish Android update

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'scripts/**'
      - '.github/workflows/publish-update.yml'
  workflow_dispatch:

concurrency:
  group: android-stable-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check release version logic
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Allocate update version
        id: version
        env:
          RELEASES_JSON: ${{ runner.temp }}/releases.json
        run: |
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[]' | jq -s '.' > "$RELEASES_JSON"
          python3 scripts/release_metadata.py
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        if: steps.version.outputs.published != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6
        if: steps.version.outputs.published != 'true'
      - name: Install Android SDK components
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: steps.version.outputs.published != 'true'
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build and verify
        if: steps.version.outputs.published != 'true'
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew verifyLicenseInventory assembleDirectRelease testDirectReleaseUnitTest lintDirectRelease bundlePlayRelease testPlayReleaseUnitTest lintPlayRelease -PreleaseVersionCode="$VERSION_CODE" -PreleaseVersionName="$VERSION_NAME"
      - name: Verify distribution privacy boundaries
        if: steps.version.outputs.published != 'true'
        run: python3 scripts/verify_distribution.py
      - name: Sign compatible production update and verify rotation
        if: steps.version.outputs.published != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          PRODUCTION_KEYSTORE_BASE64: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_BASE64 }}
          PRODUCTION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_PASSWORD }}
          PRODUCTION_KEY_ALIAS: ${{ secrets.ANDROID_PRODUCTION_KEY_ALIAS }}
          PRODUCTION_KEY_PASSWORD: ${{ secrets.ANDROID_PRODUCTION_KEY_PASSWORD }}
          SIGNING_LINEAGE_BASE64: ${{ secrets.ANDROID_SIGNING_LINEAGE_BASE64 }}
          EXPECTED_PRODUCTION_CERT: ${{ vars.ANDROID_PRODUCTION_CERT_SHA256 }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          python3 scripts/sign_release.py --apk app/build/outputs/apk/direct/release/app-direct-release-unsigned.apk --out "$RUNNER_TEMP/update/SIMple-$VERSION_CODE.apk" --version-code "$VERSION_CODE"
          cd "$RUNNER_TEMP/update"
          sha256sum "SIMple-$VERSION_CODE.apk" > SHA256SUMS.txt
      - name: Publication gate
        if: steps.version.outputs.published != 'true' && vars.ANDROID_PUBLISH_ENABLED != 'true'
        run: echo 'Build and production signatures verified. Publication is paused pending device acceptance; ANDROID_PUBLISH_ENABLED must be true to release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish stable GitHub release
        if: steps.version.outputs.published != 'true' && vars.ANDROID_PUBLISH_ENABLED == 'true'
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # A queued old run must never replace a newer main build as latest.
          MAIN_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo 'Main has newer changes; its workflow will publish the update.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Actualización automática de SIMple $VERSION_NAME.

          Descarga **SIMple-$VERSION_CODE.apk** o usa **Ajustes → Actualizar SIMple → Buscar actualización**. Android pedirá confirmar la instalación. Conserva tus datos y contactos; no desinstales la app.

          Compilación, pruebas unitarias, lint y firma verificados. Código fuente: $GITHUB_SHA.

          <!-- simple-source:$GITHUB_SHA -->
          <!-- simple-code:$VERSION_CODE -->
          EOF
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "SIMple $VERSION_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/update/SIMple-$VERSION_CODE.apk" "$RUNNER_TEMP/update/SHA256SUMS.txt" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "Publicado: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
